name: build

on:
  # Every push runs the tests and exports (spec §15); release and Pages
  # still run only for v* tags and main.
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-4.7.2-stable
      - name: Run the tests (Godot is downloaded and SHA-512 checked by tools/godot.sh)
        run: tools/test.sh

  export:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-4.7.2-stable
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2
      - name: Require the permanent signing key for a release
        # Players' phones only install a new version over the old one (keeping
        # their progress) when both are signed with the same key.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets before tagging a release (see README, Release signing)."
            exit 1
          fi
      - name: Export every platform (templates are SHA-512 checked by tools/export.sh)
        # Android uses the runner's Android SDK (ANDROID_HOME). Without these
        # secrets the app is signed with a debug key made for this build.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: tools/export.sh all
      - name: Check every download carries its licenses and credits
        run: tools/check_dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Circuit-linux
          path: build/dist/Circuit-linux.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Circuit-windows
          path: build/dist/Circuit-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Circuit-macos
          path: build/dist/Circuit-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Circuit-web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: Circuit-android
          path: build/dist/Circuit-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Circuit-*
          path: build/artifacts
      - name: Collect the zips
        run: |
          mkdir -p build/dist
          for p in linux windows macos; do cp "build/artifacts/Circuit-$p/Circuit-$p.zip" build/dist/; done
          cp build/artifacts/Circuit-android/Circuit-android.apk build/dist/
          (cd build/artifacts/Circuit-web && zip -q -r ../../dist/Circuit-web.zip .)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made on GitHub's website for this tag gets the downloads
        # attached; otherwise the release is created here.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/dist/*.zip build/dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/dist/*.zip build/dist/*.apk --title "Circuit $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi

  pages:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Circuit-web
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
